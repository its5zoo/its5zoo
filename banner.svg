<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29" />
      <stop offset="50%" stop-color="#241442" />
      <stop offset="100%" stop-color="#14092A" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="140" rx="16" fill="url(#bgGrad)" stroke="#381E68" stroke-width="1.5"/>

  <!-- Decorative Glow Accents -->
  <circle cx="60" cy="20" r="90" fill="#7B2CBF" opacity="0.3" filter="url(#glow)"/>
  <circle cx="740" cy="120" r="80" fill="#00F5D4" opacity="0.25" filter="url(#glow)"/>

  <!-- Header Main Title -->
  <text x="400" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="30" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">
    MD FAIZAAN RAZA KHAN
  </text>

  <!-- Subtitle -->
  <text x="400" y="94" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#00F5D4" text-anchor="middle" letter-spacing="3">
    FULL-STACK DEVELOPER • DATA SCIENCE &amp; AI ENTHUSIAST
  </text>

  <!-- Divider Accent Bar -->
  <rect x="250" y="108" width="300" height="3" rx="1.5" fill="url(#subGrad)" opacity="0.9"/>
</svg>
